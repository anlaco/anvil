syntax = "proto3";

// A named, typed value. The three types are exactly those of `expr::Value` and
// `modelo::ValorDefinicion`: no more (no lists, no maps — a parameter that
// needs structure is a badly cut step, ADR-0020 §2) and no fewer.
//
// A `oneof` with no branch set is an **error**, not a zero (ADR-0020 §2, which
// is Rule 2 of ADR-0019 applied to the inbound wire).
message Value {
  string name = 1;
  oneof value {
    double number  = 2;
    string text    = 3;
    bool   boolean = 4;
  }
}

message StepRequest {
  string name = 1;
  int32 attempt = 2;
  // This invocation's inputs, already evaluated by the engine (ADR-0009:
  // expressions are the engine's job, the step never sees the environment).
  // They travel *inside* the call rather than in a prior configuration RPC:
  // splitting the call in two would make the executor stateful, and two
  // concurrent invocations would step on each other (ADR-0020 §1).
  repeated Value inputs = 3;
  // Contract version spoken by the engine. See `contract` below and ADR-0020 §4.
  int32 contract = 4;
}

message StepResult {
  string name = 1;
  // One of "pass", "fail", "error", "skipped" — closed vocabulary. Any other
  // string turns the step into "error": a status Anvil cannot read says
  // nothing about the unit under test (ADR-0019, Rule 2).
  string status = 2;
  string message = 3;
  string measured_value = 4;
  string limit_min = 5;
  string limit_max = 6;
  // Named values the step returns *besides* the measurement. They take no part
  // in the verdict: the engine still judges `measured_value` against the
  // sequence's `limit`, and nothing else (ADR-0008). `assign` reads them as
  // `result.outputs.<name>`.
  repeated Value outputs = 7;
  // The echo: the contract version the executor actually **understood**. This
  // is what prevents the silent false pass — an old executor ignores `inputs`,
  // measures something else and reports "pass" (ADR-0020 §4b). An executor
  // speaking contract 1 does not know this tag and returns 0 by proto3 default.
  int32 contract = 8;
}

service StepExecutor {
  rpc Invoke(StepRequest) returns (StepResult);
}
