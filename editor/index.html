<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anvil Sequence Editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      TestStand's Sequence Editor, arranged as TestStand 2026Q3 arranges it
      (AP-02, ADR-0043): the Insertion Palette docked left with Templates and
      IO Configurations beside it, the step list in the middle, Variables /
      Sequences / Execution docked right, the settings of the selected step
      underneath, and a status bar along the bottom.

      What Anvil does not have is not left off: it is here, greyed, saying what
      TestStand does there and where Anvil stands (AP-13). The menu bar and the
      execution controls are built from `src/paridad.mjs`, which is the one
      place that knows — so this file holds the shell and none of the
      inventory.
    -->
    <header class="toolbar">
      <nav class="menus" aria-label="Menu bar"></nav>

      <div class="views" role="tablist" aria-label="Editor view">
        <button type="button" role="tab" data-view="steps" aria-selected="true">Steps</button>
        <button type="button" role="tab" data-view="text" aria-selected="false">Text</button>
      </div>

      <span class="filename" id="filename">no file</span>

      <!-- TestStand's execution toolbar. Run is Anvil's; the rest are where
           TestStand puts them, greyed, each naming what it waits on. -->
      <div class="exec-controls" id="exec-controls" aria-label="Execution controls">
        <button type="button" class="run" id="run" disabled>Run</button>
      </div>
    </header>

    <main class="panes">
      <!--
        The Insertion Palette, as TestStand 2026Q3 builds it: one pane holding
        two collapsible sections — Step Types, and Templates/IO Configurations
        with its own pair of tabs inside. Not three sibling tabs: the palette
        is not one of them, it is what contains them.
      -->
      <section class="pane palette" aria-label="Insertion palette">
        <h2>Insertion Palette</h2>
        <div class="scroll palette-body">
          <h3 class="section">Step Types</h3>
          <div id="palette"></div>

          <h3 class="section">Templates/IO Configurations</h3>
          <div class="pane-tabs" role="tablist" aria-label="Templates and IO configurations">
            <button type="button" role="tab" data-left="templates" aria-selected="true">
              Templates
            </button>
            <button type="button" role="tab" data-left="io" aria-selected="false">
              IO Configurations
            </button>
          </div>
          <div id="templates"></div>
          <div id="io-configurations" hidden></div>
        </div>
      </section>

      <div class="middle">
        <section class="pane sequence" aria-label="Sequence">
          <h2 id="sequence-title">Sequence</h2>
          <!-- TestStand's three columns, and the gutter a breakpoint would
               live in. The gutter is drawn and nothing can be set in it:
               the engine cannot stop at a step. -->
          <div class="step-head" aria-hidden="true">
            <span class="gutter"></span>
            <span class="c-step">Step</span>
            <span class="c-desc">Description</span>
            <span class="c-settings">Settings</span>
          </div>
          <div id="sequence-list" class="scroll"></div>
        </section>

        <section class="pane step" aria-label="Step settings">
          <div class="pane-tabs" role="tablist" aria-label="Docked bottom">
            <button type="button" role="tab" data-bottom="step" aria-selected="true">
              Step Settings
            </button>
            <button type="button" role="tab" data-bottom="output" aria-selected="false">
              Output
            </button>
            <button type="button" role="tab" data-bottom="analysis" aria-selected="false">
              Analysis Results
            </button>
          </div>
          <h2 id="step-title">Step Settings</h2>
          <div id="step-editor" class="scroll"></div>
          <div id="output" class="scroll" hidden></div>
        </section>

        <section class="pane text" aria-label="Text" hidden>
          <h2>Text</h2>
          <div id="text-editor" class="scroll"></div>
        </section>
      </div>

      <section class="pane variables" aria-label="Variables, sequences and execution">
        <div class="pane-tabs" role="tablist" aria-label="Docked right">
          <button type="button" role="tab" data-right="variables" aria-selected="true">
            Variables
          </button>
          <button type="button" role="tab" data-right="sequences" aria-selected="false">
            Sequences
          </button>
          <button type="button" role="tab" data-right="execution" aria-selected="false">
            Execution
          </button>
        </div>
        <div id="variables" class="scroll"></div>
        <div id="sequences" class="scroll" hidden></div>
        <div id="execution" class="scroll" hidden></div>
      </section>
    </main>

    <!--
      TestStand's status bar, in TestStand's order. User and Environment are
      greyed: Anvil has no notion of who is running it, and configures a run
      from its CLI switches.
    -->
    <footer class="status" id="status">
      <span class="light" id="status-light" data-state="unknown"></span>
      <span id="status-text">no file open</span>
      <span class="status-fields" id="status-fields"></span>
      <!-- Which editor this is and which engine Run uses. Filled in only inside
           the desktop shell, which is the only place both are known. -->
      <span class="versions" id="versions" hidden></span>
    </footer>

    <script type="module" src="/src/app.mjs"></script>
  </body>
</html>
