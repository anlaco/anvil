[package]
name = "anvil-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Host nativo de Anvil: un binario que hospeda wasmtime y los dos guests WASM (motor + ejecutor)"

[dependencies]
wasmtime = "47"
wasmtime-wasi = "47"

[[bin]]
name = "anvil"
path = "src/main.rs"

# Workspace standalone: NO forma parte del workspace del core de Anvil, para
# que el build normal (`cargo build` / `cargo test` en la raíz) no arrastre
# wasmtime. Se compila aparte; ver `docs/guia-inicio-rapido.md` y ADR-0011.
[workspace]