[package]
name = "anvil-host"
version = "0.9.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Anvil's native host: one binary that hosts wasmtime and the engine guest"

[dependencies]
wasmtime = "47"
wasmtime-wasi = "47"
# `cargador`/`modelo` del core: el host re-parsea el YAML de la secuencia
# (M5-ext.1) para recolectar los `ejecutores:` — las IPs no-loopback
# declaradas (relajación acotada del loopback, ADR-0011) y los `.wasm` por
# path (M5-ext.2). Son crates puros (sin wasmtime), así que linkan a nativo
# sin arrastrar nada del sandbox WASM.
cargador = { path = "../../crates/cargador" }
modelo = { path = "../../crates/modelo" }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[[bin]]
name = "anvil"
path = "src/main.rs"

# Workspace standalone: NO forma parte del workspace del core de Anvil, para
# que el build normal (`cargo build` / `cargo test` en la raíz) no arrastre
# wasmtime. Se compila aparte; ver `docs/guia-inicio-rapido.md` y ADR-0011.
[workspace]

[dev-dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# `tests/describe.rs` parsea el JSON de `anvil describe` (ADR-0044). Versión
# suelta y no `workspace = true`: este crate es un workspace propio a
# propósito, para que el core no arrastre wasmtime. Sólo en tests, y el host
# es nativo: no toca el tamaño del `.wasm`.
serde_json = "1"
