[package]
name = "anvil-host"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Host nativo de Anvil: un binario que hospeda wasmtime y los dos guests WASM (motor + ejecutor)"

[dependencies]
wasmtime = "47"
wasmtime-wasi = "47"
# `cargador`/`modelo` del core: el host re-parsea el YAML de la secuencia
# (M5-ext.1) para recolectar los `ejecutores:` — las IPs no-loopback
# declaradas (relajación acotada del loopback, ADR-0011) y los `.wasm` por
# path (M5-ext.2). Son crates puros (sin wasmtime), así que linkan a nativo
# sin arrastrar nada del sandbox WASM.
cargador = { path = "../../crates/cargador" }
modelo = { path = "../../crates/modelo" }

[[bin]]
name = "anvil"
path = "src/main.rs"

# Workspace standalone: NO forma parte del workspace del core de Anvil, para
# que el build normal (`cargo build` / `cargo test` en la raíz) no arrastre
# wasmtime. Se compila aparte; ver `docs/guia-inicio-rapido.md` y ADR-0011.
[workspace]