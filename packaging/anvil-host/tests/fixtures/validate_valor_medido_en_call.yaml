# Issue #20: un sequence_call no mide; `result.measured_value` vale siempre
# `nothing` y borraba el destino en silencio.
name: validate_valor_medido_en_call
locals:
  my_num: 42.0
subsequences:
  hija:
    main:
      - name: medir_voltaje
        type: grpc
main:
  - name: call_sub
    type: sequence_call
    sequence: hija
    assign:
      my_num: '${result.measured_value}'
