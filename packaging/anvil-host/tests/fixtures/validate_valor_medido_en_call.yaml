# Issue #20: un sequence_call no mide; `resultado.valor_medido` vale siempre
# `nothing` y borraba el destino en silencio.
nombre: validate_valor_medido_en_call
locals:
  my_num: 42.0
subsecuencias:
  hija:
    main:
      - nombre: medir_voltaje
        tipo: grpc
main:
  - nombre: call_sub
    tipo: sequence_call
    secuencia: hija
    asigna:
      my_num: '${resultado.valor_medido}'
