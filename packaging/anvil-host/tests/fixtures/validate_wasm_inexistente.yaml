# El contrapunto del anterior: --validate no instancia, pero sigue
# comprobando que el fichero declarado existe.
name: validate_wasm_inexistente
main:
  - name: medir_voltaje
    type: numeric_limit
    module: medir_voltaje
    executor: w
    limit: { comparison: GELE, low: 0.0, high: 10.0 }
executors:
  - name: w
    type: wasm
    path: ./no_existe.wasm
