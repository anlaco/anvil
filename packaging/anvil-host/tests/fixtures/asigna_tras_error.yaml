# Fixture for `tests/exit_codes.rs`: issue #27, case 2 — `assign` does not write
# when the step gave `error` (ADR-0019, Rule 2).
#
# `demo/instrument_offline` is the demo bench's instrument that is not there:
# it always returns `error`. Before, the `assign` ran
# anyway: `result.*` was `nothing` and that `nothing` clobbered `locals.valor`,
# which `cleanup` reads right after to decide. On a real bench that variable is
# the one that says whether a supply has to be switched off.
#
#   === exit_asigna_tras_error: error ===
#     [error] demo/instrument_offline: the instrument did not answer
#     [pass] check_valor: condición cumplida
#
# The verdict is `error` (exit 1) because of the step that could not measure;
# what this fixture watches is the `cleanup` line.
#
# **Why it is a real step and not a made-up one**, which it was until
# ADR-0021: since the catalog, a step the executor does not serve stops the run
# **before the first step**, so a non-existent name never gets executed and
# cannot exercise the `assign`. It needs a step that exists and fails to
# measure, which is also the realistic case.

name: exit_asigna_tras_error

executors:
  - { name: demo, type: grpc, host: 127.0.0.1, port: 9101 }

locals:
  valor: 99.0

main:
  - name: demo/instrument_offline
    type: pass_fail
    module: demo/instrument_offline
    executor: demo
    assign:
      valor: '${result.measured_value}'

cleanup:
  - name: check_valor
    type: pass_fail
    condition: 'locals.valor == 99.0'
