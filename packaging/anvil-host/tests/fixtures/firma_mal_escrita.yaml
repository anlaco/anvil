# Fixture for `tests/exit_codes.rs`: ADR-0021 / issues #45 and #54 — a typo in
# a parameter's name and another in an output's.
#
# Both are on the demo bench, which does describe its catalog:
#   - `demo/measure_voltage` takes `channel` and `offset`; here it says `channell`.
#   - it returns `channel_used` and `temperature`; here it reads `temperaturee`.
#
# Until ADR-0021 this loaded without a complaint (ADR-0020 §3 wrote it down as
# the exception to ADR-0019's detection rule) and was only noticed with the
# unit already on the bench. Now it exits 1 without running a single step.

name: firma_mal_escrita

executors:
  - { name: demo, type: grpc, host: 127.0.0.1, port: 9101 }

locals:
  t: 0.0

main:
  - name: demo/measure_voltage
    type: pass_fail
    module: demo/measure_voltage
    executor: demo
    inputs:
      channell: 3
    assign:
      t: result.outputs.temperaturee
