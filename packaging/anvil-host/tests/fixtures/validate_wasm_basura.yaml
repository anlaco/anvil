# Issue #22: `--validate` levantaba el puente WASM. El `.wasm` existe (así
# pasa la validación de path del cargador) pero no es un componente: si el
# puente llegara a arrancar, moriría al instanciarlo y se notaría.
name: validate_wasm_basura
locals:
  v: 0.0
executors:
  - name: w
    type: wasm
    path: ./no_es_componente.wasm
main:
  - name: medir_voltaje
    type: numeric_limit
    module: medir_voltaje
    executor: w
    limit: { comparison: GELE, low: 0.0, high: 10.0 }
