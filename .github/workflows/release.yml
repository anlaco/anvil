# Builds a release's downloads on the platform each one is for, and puts them
# in a **draft** Release for a person to read and publish. Nothing here
# publishes: `verifica-release.yml` runs on publish and checks the Linux
# tarball in clean containers, so the order is build → draft → look → publish.
#
# What is built:
#   - Linux   the engine, statically linked against musl  (packaging/package.sh)
#   - Windows the engine, static CRT                      (packaging/package.ps1)
#   - Linux   the Sequence Editor, AppImage and .deb      (editor/, ADR-0037)
#   - Windows the Sequence Editor installer, NSIS         (editor/, ADR-0037)
#
# The editor's `latest.yml` (Windows) and `latest-linux.yml` (AppImage) go up
# with them: an installed editor reads them from the latest *published*
# Release to update itself, so publishing the draft is what ships an update.
#
# The Windows pieces are built on windows-latest because package.ps1 compiles
# natively for x86_64-pc-windows-msvc; nothing is cross-compiled.
#
# Two ways in:
#   - pushing a `release/**` branch builds the artifacts and stops, so the
#     packaging is exercised before anything reaches main;
#   - running it by hand with a version builds them and creates the draft.
name: Release

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the v (e.g. 0.5.0). Must match the manifests."
        required: true
      draft:
        description: "Create the draft Release (unticked: build the artifacts only)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # One version for every artifact, taken from the host's manifest — the
      # number `anvil --version` prints. A hand-run version that disagrees with
      # it stops here rather than shipping a file whose name lies about it.
      - name: Version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          MANIFEST=$(grep -m1 '^version' packaging/anvil-host/Cargo.toml | cut -d'"' -f2)
          if [ -n "$INPUT" ] && [ "$INPUT" != "$MANIFEST" ]; then
            echo "::error::version $INPUT asked for, but the manifests say $MANIFEST"
            exit 1
          fi
          echo "VERSION=$MANIFEST" >> "$GITHUB_ENV"

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2, x86_64-unknown-linux-musl

      - name: musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            packaging/anvil-host
            executors/wasm
            ejemplos/hola-paso
            ejemplos/departamento

      - name: Package the engine
        run: ./packaging/package.sh "$VERSION"

      # The package must run what it says it runs before it is uploaded:
      # the binary answers its version and loads a sequence.
      - name: "Smoke: the packaged anvil"
        run: |
          D="dist/anvil-v$VERSION-x86_64-linux-musl"
          # `--version` writes to stderr, hence the 2>&1: without it grep
          # reads nothing and the smoke fails on a correct binary.
          "$D/anvil" --version 2>&1 | grep -F "$VERSION"
          "$D/anvil" --validate "$D/ejemplos/basica.yaml"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The CHANGELOG promises the editor as an AppImage and a .deb on Linux
      # (ADR-0037 puts Linux first), so the Linux job builds them too, from
      # the release guest package.sh has just built — one engine in both
      # downloads (ADR-0031).
      - name: Build the Sequence Editor (AppImage, deb)
        working-directory: editor
        run: |
          npm ci
          npm run transpile
          npm run app:build -- --linux AppImage deb --publish never -c.extraMetadata.version="$VERSION"
          ls ../dist-app

      # ADR-0031 on what actually ships: the engine modules packed into the
      # editor must be, byte for byte, inside the anvil in the tarball. The
      # AppImage and the .deb are both packed from linux-unpacked/.
      - name: "Check: the editor and anvil carry the same engine"
        working-directory: editor
        run: |
          node scripts/same-engine.mjs \
            ../dist-app/linux-unpacked/resources/app.asar \
            "../dist/anvil-v$VERSION-x86_64-linux-musl/anvil"

      # The AppImage already carries its download name (`appImage.artifactName`
      # in editor/package.json), and it has to: `latest-linux.yml` is what an
      # installed editor reads to update itself, and it names the file it was
      # written for. Renaming the AppImage here would publish an update that is
      # announced and then fails to download.
      - name: Name the downloads
        run: |
          mkdir -p upload
          cp "dist/anvil-v$VERSION-x86_64-linux-musl.tar.gz" upload/
          APPIMAGE="dist-app/anvil-editor-v$VERSION-x86_64-linux.AppImage"
          DEB=$(ls dist-app/*"$VERSION"*.deb | head -1)
          test -f "$APPIMAGE" && test -n "$DEB" && test -f dist-app/latest-linux.yml
          grep -F "anvil-editor-v$VERSION-x86_64-linux.AppImage" dist-app/latest-linux.yml
          cp "$APPIMAGE" dist-app/latest-linux.yml upload/
          cp "$DEB" "upload/anvil-editor-v$VERSION-amd64.deb"
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: upload/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          MANIFEST=$(grep -m1 '^version' packaging/anvil-host/Cargo.toml | cut -d'"' -f2)
          if [ -n "$INPUT" ] && [ "$INPUT" != "$MANIFEST" ]; then
            echo "::error::version $INPUT asked for, but the manifests say $MANIFEST"
            exit 1
          fi
          echo "VERSION=$MANIFEST" >> "$GITHUB_ENV"

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2, x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            packaging/anvil-host
            executors/wasm
            ejemplos/hola-paso
            ejemplos/departamento

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package the engine
        shell: pwsh
        run: ./packaging/package.ps1 $env:VERSION

      - name: "Smoke: the packaged anvil.exe"
        run: |
          D="dist/anvil-v$VERSION-x86_64-windows"
          # `--version` writes to stderr, hence the 2>&1.
          "$D/anvil.exe" --version 2>&1 | grep -F "$VERSION"
          "$D/anvil.exe" --validate "$D/ejemplos/basica.yaml"

      # The editor embeds the engine guest transpiled to JavaScript, and
      # `generated/` is not committed: it is transpiled here from the release
      # guest package.ps1 has just built, so both downloads carry one engine
      # (ADR-0031). The installer's version comes from the same manifest —
      # editor/package.json stays at 0.0.0 and is not the source of truth.
      - name: Build the Sequence Editor installer
        working-directory: editor
        run: |
          npm ci
          npm run transpile
          npm run app:build -- --win nsis --publish never -c.extraMetadata.version="$VERSION"
          ls ../dist-app

      # ADR-0031 on what actually ships; the installer is packed from
      # win-unpacked/.
      - name: "Check: the editor and anvil.exe carry the same engine"
        working-directory: editor
        run: |
          node scripts/same-engine.mjs \
            ../dist-app/win-unpacked/resources/app.asar \
            "../dist/anvil-v$VERSION-x86_64-windows/anvil.exe"

      # Named at build time (`nsis.artifactName` in editor/package.json), not
      # here, for the same reason as the AppImage: `latest.yml` names the
      # installer an installed editor downloads to update itself. The blockmap
      # lets that download fetch only what changed.
      - name: Collect the installer and its update metadata
        run: |
          SETUP="dist-app/anvil-editor-v$VERSION-x86_64-windows-setup.exe"
          test -f "$SETUP" && test -f "$SETUP.blockmap" && test -f dist-app/latest.yml
          grep -F "anvil-editor-v$VERSION-x86_64-windows-setup.exe" dist-app/latest.yml
          mkdir -p upload
          cp dist/anvil-v$VERSION-x86_64-windows.zip upload/
          cp "$SETUP" "$SETUP.blockmap" dist-app/latest.yml upload/
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: upload/*
          if-no-files-found: error

  draft:
    needs: [linux, windows]
    if: github.event_name == 'workflow_dispatch' && inputs.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # One SHA256SUMS for every download. verifica-release.yml checks it with
      # only the tarball downloaded, which is why it uses --ignore-missing.
      - name: SHA256SUMS
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The notes are this version's CHANGELOG section, so what the Release
      # page says and what the repo records cannot drift.
      - name: Notes from the CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no '## [$VERSION]' section in CHANGELOG.md"; exit 1; }

      - name: Create the draft
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::a release v$VERSION already exists"
            exit 1
          fi
          gh release create "v$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            assets/*
