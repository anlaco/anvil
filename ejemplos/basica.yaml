# Example sequence "basica", expressed as data (ADR-0002).
# It is the same content as crates/motor/src/bin/basica_datos.rs, but in
# YAML: loading it with `anvil ejemplos/basica.yaml` produces the same
# execution as the reference binary.
#
# M1/M3 schema: name, retries, the three sections and, since M3, the
# per-step `limit` (RF-29). medir_voltaje's threshold lives here, not in the
# step's code: the step measures 4.2 V and the engine evaluates the 4.5–5.5
# range (ADR-0008). Fields from later milestones (disable, pause_on_fail,
# etc.) are still rejected — they arrive in M4.

name: basica
setup:
  - name: conectar_equipo
    retries: 3
main:
  - name: medir_voltaje
    retries: 1
    limit:
      type: range
      min: 4.5
      max: 5.5
  - name: verificar_led
    retries: 1
cleanup:
  - name: desconectar_equipo
    retries: 1
