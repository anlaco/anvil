# Demo of multi-endpoint routing (M5-ext.1, RF-36.3).
#
# A WASM component (the demo bench, served by `anvil-exec-wasm`) serves one step
# and a Python executor on loopback serves two others. The engine dispatches
# by name→endpoint (`executor:` on the step → `executors:` in the YAML); it
# neither knows nor cares what is behind each endpoint (ADR-0013).
#
# Start-up:
#   # terminal 1: TCP simulator (stand-in for the simulator's equipment)
#   python3 executors/python/simulador_tcp.py
#   # terminal 2: Python executor on loopback (127.0.0.1:9101). Its steps
#   # live in executors/python/steps/, not inside server.py (ADR-0021).
#   cd executors/python && python3 server.py
#   # terminal 3: Anvil, which starts the demo bench itself
#   ./anvil ejemplos/demo_ejecutores.yaml --json /tmp/out.json
#
# Variant with an executor override (R&D vs. factory, the --limits pattern):
#   ./anvil ejemplos/demo_ejecutores.yaml --executor python=127.0.0.1:9200
#   (with another server.py on --port 9200; the YAML is not touched)
#
# Check that the sequence matches what the executors offer, without running a
# single step (ADR-0021):
#   ./anvil ejemplos/demo_ejecutores.yaml --validate --with-executors

name: demo_ejecutores
executors:
  - { name: demo, type: wasm, path: departamento/dist/anvil-exec-wasm }
  - name: python
    type: grpc
    host: 127.0.0.1
    port: 9101
main:
  # A step of the demo bench, a WASM component: the host spawns its executor.
  - name: demo/check_led
    type: pass_fail
    module: demo/check_led
    executor: demo
    retries: 1

  # Step on the Python executor on loopback: the engine dispatches over gRPC
  # to 127.0.0.1:9101; the Python one talks TCP to the simulator and returns
  # the measurement. The engine evaluates the limit from the YAML (ADR-0008).
  - name: instrument/medir_simulador
    type: numeric_limit
    module: instrument/medir_simulador
    executor: python
    retries: 1
    limit:
      comparison: GELE
      low: 4.0
      high: 5.0

  # Connection to the simulated equipment: transient fail on attempt 1, passes
  # from attempt 2 (RF-09: the attempt number reaches the step).
  - name: instrument/conectar_equipo
    type: action
    module: instrument/conectar_equipo
    executor: python
    retries: 3
