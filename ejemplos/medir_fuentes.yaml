# Subsecuencia externa (M4b): secuencia pública reutilizable por path.
# La invoca `subsecuencia.yaml` con `secuencia: ./medir_fuentes.yaml`.
#
# Demuestra Parameters de entrada/salida by-reference (como TestStand):
#   - Recibe `canal` del padre al iniciar.
#   - Lo muta (`parameters.canal = parameters.canal + 1.0`) con un statement.
#   - Al volver, el motor copia `parameters.canal` (final) al `locals.canal_in`
#     del padre (el mismo lvalue de la entrada).
name: medir_fuentes
parameters:
  canal: 0.0
main:
  - name: ajustar_canal
    type: statement
    statement: 'parameters.canal = parameters.canal + 1.0'
  - name: medir_voltaje
    type: grpc
    retries: 1
    limit:
      type: range
      min: 4.0
      max: 5.0
cleanup:
  - name: desconectar_equipo
    type: grpc
    retries: 1