# Demo of the host-side `.wasm` loader by path (M5-ext.2, ADR-0015).
#
# No Docker, no Python, no cloning the repo: the `.wasm` is a **WASM
# component** that exports the function `run` (interface `anvil:step`). The
# user writes the step in Rust, compiles it to `.wasm`, references it by path
# (TestStand's `.vi` model) and Anvil runs it. It knows nothing of gRPC or
# protobuf — the host bridges it (ADR-0015).
#
# The demo's `.wasm` is `ejemplos/hola-paso` (the guide's "hello world").
#
# The component is built and deployed into the example department, next to
# the executor's binary (`make build` does it):
#   cargo build --target wasm32-wasip2 --manifest-path ejemplos/hola-paso/Cargo.toml
#   cp ejemplos/hola-paso/target/wasm32-wasip2/debug/hola_paso.wasm \
#      ejemplos/departamento/dist/
#
# Start-up (from the repo root):
#   cargo build --target wasm32-wasip2 -p motor -p ejecutor_pasos
#   cargo build --manifest-path executors/wasm/Cargo.toml
#   cargo build --manifest-path packaging/anvil-host/Cargo.toml
#   ./packaging/anvil-host/target/debug/anvil ejemplos/demo_wasm.yaml --json out.json
#
# (The `path:` is relative to the YAML's directory (`ejemplos/`) and points
# **at the executor's binary** (ADR-0027), not at the `.wasm`: the executor
# finds the modules next to itself. The host spawns it and logs
# `name → 127.0.0.1:<ephemeral port>`.)

name: demo_wasm
executors:
  - name: embebido
    type: embedded
  - name: mi_paso_wasm
    type: wasm
    path: departamento/dist/anvil-exec-wasm
main:
  # Built-in step: served by the embedded WASM executor (the default one). It
  # declares no `executor` → embedded by default.
  - name: verificar_led
    retries: 1

  # Step in the `.wasm` loaded by path: the host spawns the bridge, which calls
  # the component's `run`. The component returns measured value 4.2; the
  # engine evaluates the limit from the YAML (ADR-0008).
  - name: hola_paso/medir_voltaje
    executor: mi_paso_wasm
    retries: 1
    limit:
      type: range
      min: 4.0
      max: 5.0

  # Another step in the same `.wasm` (same path → the host shares a single
  # bridge: 1 Store, N calls, TestStand's RTE pattern).
  - name: hola_paso/conectar_equipo
    executor: mi_paso_wasm
    retries: 3

  # A step with a parameter. Since `anvil:step@0.4.0` the component
  # **describes its catalog**, so `--validate --with-executors` checks that
  # `a_quien` exists and is text without running anything (ADR-0021, ADR-0024).
  - name: hola_paso/hola
    executor: mi_paso_wasm
    retries: 1
    inputs:
      a_quien: mundo
