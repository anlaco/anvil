# Demo del cargador de `.wasm` por path host-side (M5-ext.2, ADR-0015).
#
# Sin Docker, sin Python, sin clonar el repo: el `.wasm` es un **componente
# WASM** que exporta la función `run` (interfaz `anvil:step`). El usuario
# escribe el paso en Rust, lo compila a `.wasm`, lo referencia por path
# (modelo `.vi` de TestStand) y Anvil lo ejecuta. No sabe de gRPC ni de
# protobuf — el host lo puentea (ADR-0015).
#
# El `.wasm` de la demo es `ejemplos/hola-paso` (el "hola mundo" de la guía).
#
# Compilar el componente (requiere cargo-component instalado):
#   cargo install cargo-component --locked
#   cargo component build --manifest-path ejemplos/hola-paso/Cargo.toml
#   # → ejemplos/hola-paso/target/wasm32-wasip1/debug/hola_paso.wasm
#
# Arranque (desde la raíz del repo):
#   cargo build --target wasm32-wasip2 -p motor -p ejecutor_pasos
#   cargo build --manifest-path executors/wasm/Cargo.toml
#   cargo build --manifest-path packaging/anvil-host/Cargo.toml
#   ./packaging/anvil-host/target/debug/anvil ejemplos/demo_wasm.yaml --json out.json
#
# (El `path:` es relativo al directorio del YAML (`ejemplos/`); al resolver
# queda `ejemplos/hola-paso/target/wasm32-wasip1/debug/hola_paso.wasm`. El
# host spawnea el puente y loguea `nombre → 127.0.0.1:<puerto efímero>`.)

name: demo_wasm
executors:
  - name: embebido
    type: embedded
  - name: mi_paso_wasm
    type: wasm
    path: hola-paso/target/wasm32-wasip1/debug/hola_paso.wasm
main:
  # Paso built-in: lo atiende el ejecutor WASM embebido (de serie). No
  # declara `ejecutor` → embebido por defecto.
  - name: verificar_led
    retries: 1

  # Paso en el `.wasm` cargado por path: el host spawnea el puente, que
  # llama a `run` del componente. El componente devuelve valor_medido 4.2;
  # el límite lo evalúa el motor desde el YAML (ADR-0008).
  - name: medir_voltaje
    executor: mi_paso_wasm
    retries: 1
    limit:
      type: range
      min: 4.0
      max: 5.0

  # Otro paso en el mismo `.wasm` (mismo path → el host comparte un único
  # puente: 1 Store, N llamadas, patrón RTE de TestStand).
  - name: conectar_equipo
    executor: mi_paso_wasm
    retries: 3
