# M4-core: variables, precondition, assign, statement and flow control.
#
# Exercises the scopes (RF-31), the precondition (RF-33), flow control
# (RF-34: disable / pause_on_fail), the local `statement` step (RF-27) and
# dumping `result` into `Locals` with `assign`. The variables live in the
# engine; a step only receives the `inputs` it is given (ADR-0020).
#
# Expected result (demo/measure_voltage reads 4.2 against the 4.5–5.5 range →
# fail by limit, ADR-0008; Main stops there):
#   === variables_demo: fail ===
#     [pass] demo/connect: instrument connected (attempt 2)
#     [pass] init_log: statement ok
#     [fail] demo/measure_voltage: 4.2 fuera de rango [4.5, 5.5]
#     [pass] demo/disconnect: instrument disconnected
# `paso_obsoleto` and `demo/check_led` are never reached: Main stops at the
# first fail (pause_on_fail reinforces it).

name: variables_demo

executors:
  - { name: demo, type: wasm, path: departamento/dist/anvil-exec-wasm }

# File globals: visible to the whole execution. The engine loads them when the
# sequence starts. Immutable during a step.
file_globals:
  lote: "A-2026-08"   # text
  umbral_min: 4.5      # number

# Empty parameters: this sequence is not called by another one.
parameters: {}

# The sequence's locals: mutable by `assign` during the execution.
locals:
  voltaje_leido: 0.0
  ok: false

setup:
  - name: demo/connect
    executor: demo
    retries: 3

main:
  # Local statement (RF-27): runs an assignment in the engine, with no executor.
  - name: init_log
    type: statement
    statement: 'locals.ok = false'

  # A step with a precondition (RF-33): it only measures if a lot is defined.
  # If the precondition were false, the step would be skipped without spending
  # an attempt.
  - name: demo/measure_voltage
    executor: demo
    retries: 1
    precondition: 'file_globals.lote != ""'
    limit:
      type: range
      min: 4.5
      max: 5.5
    # Assign (RF-31): dumps `result` fields into Locals after the step.
    assign:
      voltaje_leido: '${result.measured_value}'
      ok: '${result.status == "pass"}'

  # Disabled step (RF-34): recorded as "skipped", not invoked.
  - name: paso_obsoleto
    disable: true

  # pause_on_fail (RF-34): if this step failed, Main would stop. It is not
  # reached here: demo/measure_voltage fails first and Main stops at the first
  # fail.
  - name: demo/check_led
    executor: demo
    retries: 1
    pause_on_fail: true

cleanup:
  - name: demo/disconnect
    executor: demo
    retries: 1
