# M4-core: variables, precondition, assign, statement and flow control.
#
# Exercises the scopes (RF-31), the precondition (RF-33), flow control
# (RF-34: disable / pause_on_fail), the local `statement` step (RF-27) and
# dumping `result` into `Locals` with `assign`. Wiring them to the step over
# the wire is post-MVP: the variables live in the engine; the gRPC step does
# not receive them.
#
# Expected result (medir_voltaje measures 4.2 against the 4.5–5.5 range →
# fail by limit, ADR-0008; Main stops there):
#   === variables_demo: fallo ===
#     [paso] init_log: statement ok
#     [paso] medir_voltaje: 4.2 fuera de rango [4.5, 5.5]
#     [saltado] paso_obsoleto: disable
# Aggregate status: "fallo" (there is a fail; skipped does not count).
# `verificar_led` is not invoked: Main stops at the first fail (pause_on_fail
# reinforces it).

name: variables_demo

# File globals: visible to the whole execution. The engine loads them when the
# sequence starts. Immutable during a step.
file_globals:
  lote: "A-2026-08"   # text
  umbral_min: 4.5      # number

# Empty parameters: in M4-core there is no sequence call (reserved for M4b).
parameters: {}

# The sequence's locals: mutable by `assign` during the execution.
locals:
  voltaje_leido: 0.0
  ok: false

setup:
  - name: conectar_equipo
    retries: 3

main:
  # Local statement (RF-27): runs an assignment in the engine, with no gRPC.
  - name: init_log
    type: statement
    statement: 'locals.ok = false'

  # gRPC step with a precondition (RF-33): it only measures if a lot is
  # defined. If the precondition were false, the step would be skipped without
  # spending an attempt.
  - name: medir_voltaje
    retries: 1
    precondition: 'file_globals.lote != ""'
    limit:
      type: range
      min: 4.5
      max: 5.5
    # Assign (RF-31): dumps `result` fields into Locals after the step.
    assign:
      voltaje_leido: '${result.measured_value}'
      ok: '${result.status == "paso"}'

  # Disabled step (RF-34): recorded as "saltado", not invoked.
  - name: paso_obsoleto
    disable: true

  # pause_on_fail (RF-34): if this step failed, Main would stop. It is not
  # reached here: medir_voltaje fails first and Main stops at the first fail.
  #
  # It used to be called `verificar_frecuencia`, which no executor serves. It
  # never caused trouble because Main stops before reaching it — until someone
  # touched the limit above. It is exactly the latent failure ADR-0021 catches
  # at start-up.
  - name: verificar_led
    retries: 1
    pause_on_fail: true

cleanup:
  - name: desconectar_equipo
    retries: 1
