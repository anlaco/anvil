# Limits sidecar for ejemplos/limites.yseq (RF-30, property loader).
# Overrides demo/measure_voltage's limit: the 4.5–5.5 range written in the
# sequence becomes a comparison (>= 4.0), which 4.2 does meet. So the sequence
# passes without touching the flow — in production the threshold changes per
# lot/variant, not in the sequence's YAML. The sidecar wins over the limit in
# the sequence (ADR-0008).

demo/measure_voltage:
  comparison: GE
  low: 4.0
