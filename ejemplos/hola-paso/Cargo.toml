[package]
name = "hola_paso"
version = "0.1.0"
edition = "2021"

[dependencies]
# The SDK. Here it is a path because the example lives inside the repo; your
# own step project takes a version from crates.io and nothing else — no `wit/`
# directory, no generated `bindings.rs`, no `cargo component`.
anvil-step = { path = "../../executors/rust/anvil-step" }

[lib]
crate-type = ["cdylib"]

# Standalone (outside the core workspace): the component is an independent
# project, exactly as an outside user's would be.
[workspace]
