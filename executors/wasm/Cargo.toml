[package]
name = "anvil-exec-wasm"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "gRPC↔function bridge: serves .wasm step components (anvil:step) as a gRPC executor on loopback"

[dependencies]
# wasmtime: instantiates the user's component and calls its `run`.
wasmtime = "47"
wasmtime-wasi = "47"
# wit-bindgen: host bindings for the WIT `anvil:step` (load and call `run`).
wit-bindgen = "0.41"
# tonic: native gRPC server (the engine speaks gRPC on loopback).
# prost 0.13: the version tonic-build 0.12 generates (keep them aligned or the
# `Message` traits do not line up). The core uses prost 0.14, but the bridge
# does not link `modelo`: its pb is generated by tonic from paso.proto.
tonic = "0.12"
prost = "0.13"
# tokio: the async runtime tonic needs (the bridge is native, no WASM
# constraints).
tokio = { version = "1", features = ["rt-multi-thread"] }
# sha2: each module's artifact hash (ADR-0025 §6). Hashing reads the file and
# compiles nothing, which is what keeps "what do you serve?" a cheap question.
sha2 = "0.10"

[dev-dependencies]
# For the tests only: comparing `CONTRACT` with `modelo`'s so the two copies
# of the number never drift apart (ADR-0020 §4e). It does not enter the
# binary, so the bridge still links neither `modelo` nor drags its prost 0.14
# into the executable.
modelo = { path = "../../crates/modelo" }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
# vendored protoc: the build does not depend on a protoc installed on the
# system.
protoc-bin-vendored = "3"

[[bin]]
name = "anvil-exec-wasm"
path = "src/main.rs"

# Standalone workspace: NOT part of the Anvil core workspace, so that the
# regular build (`cargo build` / `cargo test` at the root) drags in neither
# wasmtime nor tonic. Built separately; see ADR-0015.
[workspace]