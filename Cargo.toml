[workspace]
resolver = "2"
members = [
    "crates/modelo",
    "crates/pasos_demo",
    "crates/pasos_scpi",
    "crates/ejecutor_pasos",
    "crates/motor",
    "crates/cargador",
    "crates/result_sink",
    "crates/expr",
]
# Notar: `packaging/anvil-host` es un workspace APARTE (no está aquí). Es el
# binario de distribución que hospeda wasmtime; aislarlo del core hace que
# `cargo build` / `cargo test` no arrastren wasmtime (decisión ADR-0011).

[workspace.package]
version = "0.4.0"
edition = "2021"
# anvil es el producto: se usa, no se linka. AGPL protege frente a que
# alguien lo cierre y lo revenda, sin afectar a las secuencias de test de
# quien lo usa (que son secreto industrial suyo).
# Las librerías (wasi-grpc, wasi-visa) van Apache-2.0 a propósito: se linkan
# en código ajeno y queremos que sus interfaces se adopten como referencia.
license = "AGPL-3.0-or-later"

[workspace.dependencies]
modelo = { path = "crates/modelo" }
pasos_demo = { path = "crates/pasos_demo" }
pasos_scpi = { path = "crates/pasos_scpi" }
cargador = { path = "crates/cargador" }
result_sink = { path = "crates/result_sink" }
expr = { path = "crates/expr" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
# `noyalib` es el YAML serde-mantenido y puro Rust (sin `unsafe`), sucesor
# de `serde_yaml` (archivado) y de `serde_yml` (hoy un shim deprecado hacia
# noyalib). Se linka solo en `cargador`; compila a `wasm32-wasip2`.
noyalib = "0.0.18"
# `serde_json` se linka solo en `result_sink` (sinks JSON/CSV), puro Rust y
# compila a `wasm32-wasip2`. No se añade `serde` con derive a `modelo`: el
# JSON se ensambla a mano (ver `crates/result_sink/src/json.rs`).
serde_json = "1"

# `wasi-grpc` es un proyecto aparte y público (github.com/anlaco/wasi-grpc).
# Se referencia por ruta porque anvil lo dogfoodea: los dos repos se
# desarrollan a la vez y un cambio en la pila se prueba aquí al momento.
# Cuando wasi-grpc se estabilice y se publique, esto pasa a ser una versión.
wasi-grpc = { path = "../wasi-grpc" }
