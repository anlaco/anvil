# BUG-3 (subsequence) — `assign` onto a name declared as a `parameter` silently
# creates a Local that shadows it.
#
# `assign` always writes to Locals (ADR-0009). If the target matches the name of
# a declared `parameter`, the engine did NOT warn: it created a new local, the
# parameter kept its initial value, and the by-reference return handed that
# initial value back to the parent. The whole test came out green with data
# that was not what was measured.
#
# Called from bug3-padre-asigna-parameter.yaml.
#
# Observed behaviour (at the time):
#   [paso]    medir_voltaje                     -> measures 4.2
#   [saltado] verificar_led: precondition false -> parameters.p is still 0.0
#   [paso]    abrir_rele                        -> locals.p DOES hold 4.2 (the shadow)
#
# Acceptance criterion: the loader should refuse (or at least warn about) an
# `assign` whose target is a name declared in `parameters:`.

#
# It declares no `executors:`: a subsequence file cannot, and `demo` is the
# parent's. Run on its own (DEF-3a) the loader refuses it for the shadow
# before it gets to resolving executors.
name: sub_asigna_parameter
parameters:
  p: 0.0
main:
  - name: demo/measure_voltage
    type: pass_fail
    module: demo/measure_voltage
    executor: demo
    retries: 1
    assign:
      p: '${result.measured_value}'
  # reads the PARAMETER: still 0.0 -> skipped
  - name: demo/check_led
    type: pass_fail
    module: demo/check_led
    executor: demo
    retries: 1
    precondition: 'parameters.p > 4.0'
  # reads the same-named LOCAL that assign created: holds 4.2 -> runs
  - name: demo/open_relay
    type: pass_fail
    module: demo/open_relay
    executor: demo
    retries: 1
    precondition: 'locals.p > 4.0'
