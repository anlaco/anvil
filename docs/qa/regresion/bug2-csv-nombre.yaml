# BUG-2 — the CSV's `nombre_secuencia` column holds the STATUS, not the name
#
# Reproduction:
#   ./anvil regresion/bug2-csv-nombre.yaml --csv salida.csv
#
# Header written (at the time):
#   nombre_secuencia,estado,nombre_paso,estado_paso,mensaje,valor_medido,...
# Row written:
#   paso,paso,verificar_led,paso,led encendido,,,,,
#   ^^^^ should be "regresion_csv_nombre"
#
# The sequence's name appeared in NO column of the CSV, so a CSV aggregating
# several sequences could not tell which sequence each row belonged to. The
# JSON did write it correctly (field "secuencia").
#
# Acceptance criterion: the first column must hold "regresion_csv_nombre" in
# all three rows.

name: regresion_csv_nombre
executors:
  - { name: demo, type: wasm, path: ../../../ejemplos/departamento/dist/anvil-exec-wasm }
main:
  - name: demo/check_led
    type: pass_fail
    module: demo/check_led
    executor: demo
    retries: 1
  - name: demo/open_relay
    type: pass_fail
    module: demo/open_relay
    executor: demo
    retries: 1
  - name: demo/measure_voltage
    type: numeric_limit
    module: demo/measure_voltage
    executor: demo
    retries: 1
    limit: { comparison: GE, low: 4.0 }
