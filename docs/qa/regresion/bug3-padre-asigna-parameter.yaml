# BUG-3 (parent) — the by-reference return brings back the parameter's INITIAL
# value because `assign` wrote a same-named Local in the subsequence.
#
# Reproduction:
#   ./anvil regresion/bug3-padre-asigna-parameter.yaml
#
# Observed behaviour (at the time):
#   [paso]    llama_sub    -> the subsequence measured 4.2
#   [saltado] verificar_led: precondition false
#             ^ locals.t is still 0.0: the measured value did NOT come back
#
# Acceptance criterion: either the loader refuses the `assign` onto a parameter
# (see bug3-sub-asigna-parameter.yaml), or the by-reference return brings 4.2
# and verificar_led runs.

name: padre_asigna_parameter
executors:
  - { name: demo, type: grpc, host: 127.0.0.1, port: 9101 }
locals:
  t: 0.0
main:
  - name: llama_sub
    type: sequence_call
    sequence: ./bug3-sub-asigna-parameter.yaml
    args: { p: locals.t }
  - name: demo/check_led
    type: pass_fail
    module: demo/check_led
    executor: demo
    retries: 1
    precondition: 'locals.t > 4.0'
